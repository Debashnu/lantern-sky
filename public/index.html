<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Sky</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sky">
    <canvas id="canvas"></canvas>
  </main>

  <header class="intro">
    <h1>Lantern Sky</h1>
    <p>Write a wish. Let it rise.</p>
  </header>

  <form class="wish-form" id="wishForm">
    <label for="wish">Your wish</label>
    <textarea id="wish" maxlength="120" rows="2" placeholder="I wish for..." required></textarea>
    <div class="row">
      <span class="count"><span id="count">0</span>/120</span>
      <button type="submit">Release lantern</button>
    </div>
  </form>

  <script src="app.js"></script>
</body>
</html>
